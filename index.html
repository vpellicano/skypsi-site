<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">

  <title>SkyPSI | Private review</title>
  <style>
    :root{--bg:#f2f0eb;--ink:#151a1c;--accent:#d73d19;--muted:#8c9496;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100svh;padding:8vmin;-webkit-font-smoothing:antialiased}
    main{width:min(20rem,80vw);text-align:center;opacity:1;transform:none}
    .wordmark{width:100%;height:auto;display:block;margin:0 auto 1.4rem;filter:invert(1);user-select:none;-webkit-user-drag:none}
    .tagline{font-family:var(--mono);font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);margin:0 0 3rem;user-select:none}
    form{margin:0}
    .field{position:relative;border-bottom:1px solid var(--muted);transition:border-color .25s ease}
    .field:focus-within{border-color:var(--accent)}
    input{width:100%;background:transparent;border:0;outline:0;color:var(--ink);caret-color:var(--accent);font-family:var(--mono);font-size:1.05rem;letter-spacing:.35em;text-align:center;padding:.7rem .2rem}
    input::placeholder{color:#646b6d;letter-spacing:.35em}
    button{width:100%;margin-top:1rem;padding:.75rem;border:1px solid var(--accent);border-radius:2px;background:transparent;color:var(--ink);font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;touch-action:manipulation}
    button:active{background:var(--accent)}
    .hint{font-family:var(--mono);font-size:.68rem;color:#535b5e;margin-top:1.1rem}
    #retry a{color:#343a3c;text-underline-offset:.25em}
    .err{animation:shake .4s ease}.err .field{border-color:var(--accent)}
    #unsupported{display:none;color:#343a3c;font-size:.8rem;margin-top:2rem}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
    @media(prefers-reduced-motion:reduce){.err{animation:none}}
  </style>
</head>

  <main id="m">
    <img class="wordmark" src="assets/skypsi-wordmark-white.png" alt="SkyPSI">
    <p class="tagline">Rise Under Pressure</p>
    <form id="f" autocomplete="off">
      <div class="field">
        <label for="pw" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">Access code</label>
        <input id="pw" type="password" placeholder="••••••" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" autofocus>
      </div>
      <button type="submit">Open review</button>
    </form>
    <p class="hint" id="retry"><span id="status">Private review.</span> <a id="refresh" href="/?refresh=current">Refresh current site</a></p>
    <p id="unsupported">This page needs a modern browser over HTTPS.</p>
    <noscript><p class="hint">JavaScript is unavailable. Use the refresh link above or open this page in Safari.</p></noscript>
  </main>

    }
    window.addEventListener("error",function(){gateFailure("This copy could not start.")});
    window.addEventListener("unhandledrejection",function(){gateFailure("This copy could not finish opening.")});
  </script>
